:root{color-scheme:dark;--bg:#10231f;--panel:#19332e;--line:#31534b;--ink:#e9f3df;--muted:#a9c1b5;--gold:#f5ca7d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,sans-serif;overscroll-behavior:none}header{height:57px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#19342d;border-bottom:1px solid #35554d}header strong{font-size:17px}button,select{background:#2b5146;color:#f1f7ec;border:1px solid #517c69;border-radius:9px;padding:9px 11px;font:inherit;cursor:pointer}button:active{background:#487a65}button:disabled{opacity:.4}small,.muted{color:var(--muted)}.badge{background:#294c40;border-radius:12px;padding:5px 8px;font-size:12px}#layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:calc(100dvh - 57px)}#mapbox{position:relative;overflow:hidden;background:#274638;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;top:10px;left:10px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none;max-width:95%}#hud span{background:#12261fe6;border:1px solid #426357;padding:6px 8px;border-radius:8px;font-size:12px}#mapbuttons{position:absolute;bottom:12px;left:12px;display:flex;gap:5px}#mapbuttons button{padding:9px 13px;background:#173329d9}aside{border-left:1px solid #35554d;overflow:auto;background:#142b26}nav{display:flex;gap:3px;overflow-x:auto;padding:9px 8px;position:sticky;top:0;background:#142b26;z-index:2}nav button{white-space:nowrap;padding:8px 9px;font-size:12px}nav button.active{background:#d6bd80;color:#18291f;border-color:#d6bd80}.pane{padding:8px 13px 22px}h2{font-size:16px;margin:9px 0 12px}h3{font-size:13px;color:#e9d19a;margin:16px 0 7px}.card{background:#1c3931;border:1px solid #355a4b;border-radius:11px;padding:10px;margin:7px 0}.item{padding:9px 4px;border-bottom:1px solid #315044;cursor:pointer}.item:hover{background:#24483c}.item b{display:block}.item small{display:block;margin-top:3px}.swatch{width:12px;hei </style></head><body><header><strong>🌿 My Village</strong><span class="badge">v1.0 · Autonomous World</span><span class="topspacer"></span><span id="clock" class="muted">År 1 · Dag 1</span><button id="pause" title="Pause">⏸</button><button id="save" title="Gem">💾</button></header><div id="layout"><section id="mapbox"><canvas id="world"></canvas><div id="hud"></div><div id="mapbuttons"><button id="zin">＋</button><button id="zout">－</button><button id="center">⌖</button></div></section><aside><nav id="tabs"></nav><div class="pane" id="pane"></div></aside></div><div id="modal"><div class="dialog"><header><strong id="mtitle"></strong><button id="close">✕</button></header><div id="mbody"></div></div></div><div id="toast"></div><script>
(()=>{'use strict';
const VERSION=1,KEY='my_village_autonomous_v1',WORLD=512,DAY_MS=40000,YEAR=360,MAX_PEOPLE=900,MAX_EVENTS=180,MAX_HISTORY=7000;
const names=['Ava','Eli','Mira','Noah','Luna','Otto','Freya','Ivar','Sia','Leo','Alma','Finn','Edda','Rune','Liv','Nora','Milo','Saga','Aron','Ida','Emil','Astrid','Bo','Tara','Viggo','Nina','Kian','Ella','Thea','Sven','Asta','Kai','Rosa','Erik','Lina','Mads','Tove','Odin','Sofie','Johan'];
const founderColors=['#e45757','#e88e38','#e4c54c','#68b75a','#3ab6a4','#438fd5','#7158cc','#b565c9','#e478a8','#93654a','#8a9b55','#647a9b'];
const jobs=['samler','jæger','bonde','bygger','skovhugger','minearbejder','håndværker','handler','forsker','vagt'];
const ages={baby:3,child:16,adult:62};
let S,tab='overview',selected=null,cam={x:256,y:256,z:13},paused=false,lastFrame=0,acc=0,dirty=false,renderAt=0,uiAt=0,drag=null,focusMode='all';
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d',{alpha:false}),pane=document.querySelector('#pane');
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function hash(x,y,seed=0){let n=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(seed,1442695041))|0;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295}
function noise(x,y,scale,seed){const xx=x/scale,yy=y/scale,ix=Math.floor(xx),iy=Math.floor(yy),fx=xx-ix,fy=yy-iy;let a=fx*fx*(3-2*fx),b=fy*fy*(3-2*fy);return (hash(ix,iy,seed)*(1-a)+hash(ix+1,iy,seed)*a)*(1-b)+(hash(ix,iy+1,seed)*(1-a)+hash(ix+1,iy+1,seed)*a)*b}
function terrain(x,y){const h=noise(x,y,84,2)*.6+noise(x,y,27,8)*.3+noise(x,y,9,3)*.1;const wet=noise(x,y,49,6);if(h<.27)return 'water';if(h>.74)return 'mountain';if(h<.315)return 'shore';if(wet>.59)return 'forest';if(wet<.30)return 'dry';return 'grass'}
function nearLand(x,y){return terrain(Math.round(x),Math.round(y))!=='water'&&terrain(Math.round(x),Math.round(y))!=='mountain'}
function findLand(x,y){for(let r=0;r<55;r++)for(let i=0;i<20;i++){let a=i*Math.PI/10,X=Math.round(x+Math.cos(a)*r),Y=Math.round(y+Math.sin(a)*r);if(X>2&&Y>2&&X<510&&Y<510&&nearLand(X,Y))return {x:X,y:Y}}return {x:256,y:256}}
function age(p){return Math.max(0,(S.day-p.born)/YEAR)}function dateStr(day){return `År ${1+Math.floor(day/YEAR)}, dag ${1+day%YEAR}`}
function log(msg,type='world'){S.events.unshift({day:S.day,msg,type});if(S.events.length>MAX_EVENTS)S.events.length=MAX_EVENTS;dirty=true}
function basePerson(id,x,y,color,years=20){return {id,name:pick(names),x,y,color,born:S.day-Math.round(years*YEAR),dead:null,mother:null,father:null,partner:null,children:[],village:1,home:null,job:pick(jobs.slice(0,5)),food:2,energy:70,health:100,coins:Math.round(rnd(0,5)),skill:rnd(.3,1),trust:rnd(.2,.9),ambition:Math.random(),kindness:Math.random(),aggression:Math.random(),knowledge:Math.random()*.03,action:'Udforsker',goal:null,kin:[],lastBirth:-9999};}
function start(){S={v:VERSION,seed:Math.floor(Math.random()*999999),day:0,progress:0,nextId:13,nextVillage:2,nextNation:1,people:[],history:[],villages:[],nations:[],buildings:[],events:[],relationships:[],stats:[],resources:{wood:0,stone:0,iron:0,food:15},tech:{farming:0,woodworking:0,mining:0,metalworking:0,trade:0,governance:0,medicine:0,engineering:0,electricity:0},ecology:{forest:100,wildlife:100},wars:[],roads:[],lastSaved:Date.now(),realDay:0};const pos=findLand(256,256);S.villages.push({id:1,name:'First Haven',x:pos.x,y:pos.y,pop:0,food:15,wood:3,stone:0,iron:0,coins:0,trust:65,leader:null,nation:null,law:0,guard:0,territory:6,relation:{},founded:0,buildings:0,conflicts:0});for(let i=0;i<12;i++){const a=i*Math.PI/6;let p=basePerson(i+1,pos.x+Math.cos(a)*2,pos.y+Math.sin(a)*2,founderColors[i],i<8?rnd(18,35):rnd(5,15));p.name=names[i];p.job=i<8?jobs[i%5]:'barn';S.people.push(p)}S.buildings.push({id:1,type:'camp',x:pos.x,y:pos.y,village:1,done:1,progress:1});log('12 grundlæggere ankommer til First Haven. En ny verden begynder.','history');cam.x=pos.x;cam.y=pos.y;save();}
function save(){try{S.lastSaved=Date.now();localStorage.setItem(KEY,JSON.stringify(S));dirty=false;toast('Verden gemt')}catch(e){toast('Lagerplads fuld. Eksportér en backup.')}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.v===VERSION&&Array.isArray(x.people)){S=x;return true}}catch(e){}return false}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function village(id){return S.villages.find(v=>v.id===id)}function alive(){return S.people.filter(p=>p.dead===null)}
function mutate(hex){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);const d=()=>Math.round(rnd(-19,19));return '#'+[r+d(),g+d(),b+d()].map(v=>clamp(v,25,235).toString(16).padStart(2,'0')).join('')}
function kill(p,reason){if(p.dead!==null)return;p.dead=S.day;S.history.push({id:p.id,name:p.name,born:p.born,dead:p.dead,mother:p.mother,father:p.father,color:p.color,village:p.village});if(S.history.length>MAX_HISTORY)S.history.splice(0,S.history.length-MAX_HISTORY);if(p.partner){const q=S.people.find(z=>z.id===p.partner);if(q)q.partner=null}if(reason||Math.random()<.12)log(`${p.name} døde${reason?' ('+reason+')':''}.`,'death');}
function birth(a,b){const v=village(a.village);if(!v||S.people.length>=MAX_PEOPLE)return;const parent=pick([a,b]);let color=parent.color,mutation=Math.random()<.045;if(mutation)color=mutate(color);const p=basePerson(S.nextId++,a.x+rnd(-.7,.7),a.y+rnd(-.7,.7),color,0);p.name=pick(names);p.born=S.day;p.mother=a.id;p.father=b.id;p.job='barn';p.village=a.village;p.health=85;p.food=1;p.knowledge=0;p.energy=90;a.children.push(p.id);b.children.push(p.id);a.lastBirth=S.day;S.people.push(p);log(`${p.name} blev født i ${v.name}${mutation?' med en ny farvenuance':''}.`,'birth')}
function pickJob(p,v){let counts={};for(const z of S.people)if(z.dead===null&&z.village===v.id)counts[z.job]=(counts[z.job]||0)+1;let needs=['samler','bonde','jæger','bygger','skovhugger','minearbejder','håndværker','handler','forsker','vagt'];let weights=[v.food<10?7:3,S.tech.farming>0?5:1,2,v.wood>3?3:1,3,S.tech.mining>0?2:0,S.tech.woodworking>0?2:0,S.tech.trade>0?2:0,2,v.conflicts>2?2:0];let best=0,bscore=-1;for(let i=0;i<needs.length;i++){let score=weights[i]/(1+(counts[needs[i]]||0)*.8)+Math.random()*1.4;if(score>bscore){best=i;bscore=score}}p.job=needs[best]}
function findPartner(p){if(p.partner||age(p)<18)return;let options=S.people.filter(q=>q.dead===null&&q.id!==p.id&&q.village===p.village&&!q.partner&&age(q)>=18&&Math.abs(age(p)-age(q))<18&&q.mother!==p.mother&&q.father!==p.father&&q.id!==p.mother&&q.id!==p.father&&!p.children.includes(q.id));if(options.length&&Math.random()<.13){const q=pick(options);p.partner=q.id;q.partner=p.id;log(`${p.name} og ${q.name} blev partnere.`,'social')}}
function movePerson(p,v){const home=p.home&&S.buildings.find(b=>b.id===p.home);const tx=home?home.x:v.x;const ty=home?home.y:v.y;let angle=Math.random()*Math.PI*2;let destX=clamp(tx+Math.cos(angle)*rnd(1,Math.max(3,v.territory)),1,510),destY=clamp(ty+Math.sin(angle)*rnd(1,Math.max(3,v.territory)),1,510);if(!nearLand(destX,destY))return;const dx=destX-p.x,dy=destY-p.y,d=Math.hypot(dx,dy);p.x+=dx/Math.max(1,d)*Math.min(d,1.7);p.y+=dy/Math.max(1,d)*Math.min(d,1.7)}
function build(v,type){if(S.buildings.length>1800)return;const req={hut:[4,0],farm:[2,0],workshop:[6,2],mine:[5,3],market:[7,4],guardhouse:[8,5],school:[8,5],hall:[12,8],factory:[18,12],power:[25,20]}[type];if(!req||v.wood<req[0]||v.stone<req[1])return;let site=findLand(v.x+rnd(-v.territory,v.territory),v.y+rnd(-v.territory,v.territory));if(Math.hypot(site.x-v.x,site.y-v.y)>v.territory+2)return;v.wood-=req[0];v.stone-=req[1];const b={id:S.buildings.length?Math.max(...S.buildings.map(z=>z.id))+1:1,type,x:site.x,y:site.y,village:v.id,done:0,progress:0};S.buildings.push(b);log(`${v.name}: byggeriet af ${buildingName(type)} begynder.`,'building')}
function buildingName(t){return ({camp:'lejr',hut:'hus',farm:'mark',workshop:'værksted',mine:'mine',market:'marked',guardhouse:'vagtpost',school:'skole',hall:'rådhus',factory:'fabrik',power:'kraftværk'})[t]||t}
function completeBuilding(b){b.done=1;let v=village(b.village);if(!v)return;v.buildings++;if(b.type==='hut'){let unhomed=S.people.filter(p=>p.dead===null&&p.village===v.id&&!p.home);for(const p of unhomed.slice(0,3))p.home=b.id}log(`${v.name}: ${buildingName(b.type)} er færdigbygget.`,'building')}
function techStep(v){let t=S.tech,workers=S.people.filter(p=>p.dead===null&&p.village===v.id&&p.job==='forsker'&&age(p)>=16).length;let gain=.0012+workers*.002;let opts=['farming','woodworking','mining','trade','governance','medicine','engineering','metalworking','electricity'];let k=pick(opts);let requirements={metalworking:t.mining>=1&&v.iron>=3,electricity:t.engineering>=2&&t.metalworking>=2,engineering:t.woodworking>=1,governance:S.villages.length>1||v.conflicts>1};if(requirements[k]===false)return;t[k]+=gain;if(t[k]>=1&&t[k]-gain<1)log(`Opdagelse: ${techName(k)}!`,'tech');if(t[k]>=2&&t[k]-gain<2)log(`Ny viden: avanceret ${techName(k)}.`,'tech')}
function techName(k){return ({farming:'landbrug',woodworking:'træbearbejdning',mining:'minedrift',trade:'handel',governance:'samfundsregler',medicine:'lægekunst',engineering:'ingeniørkunst',metalworking:'metalbearbejdning',electricity:'elektricitet'})[k]}
function villageDaily(v,people){v.pop=people.length;if(!people.length)return;v.food-=people.length*.19;let gather=0,wood=0,stone=0,iron=0,work=0;for(let p of people){let a=age(p);if(a<3){p.action='Bliver passet';continue}if(a<16){p.action='Leger og lærer';p.knowledge+=.00003;continue}if(p.energy<15){p.energy=clamp(p.energy+22,0,100);p.action='Hviler';continue}if(Math.random()<.008)pickJob(p,v);let efficiency=.45+p.skill*.7;if(p.job==='samler'){gather+=.6*efficiency;p.action='Samler mad'}else if(p.job==='jæger'){gather+=.8*efficiency*(S.ecology.wildlife/100);p.action='Jager';S.ecology.wildlife=clamp(S.ecology.wildlife-.0009,5,100)}else if(p.job==='bonde'){gather+=(S.tech.farming>=1?1.45:.35)*efficiency;p.action='Dyrker marker'}else if(p.job==='skovhugger'){wood+=.65*efficiency*(S.ecology.forest/100);p.action='Hugger træ';S.ecology.forest=clamp(S.ecology.forest-.0015,3,100)}else if(p.job==='minearbejder'){stone+=.4*efficiency;iron+=S.tech.mining>=1?.14*efficiency:0;p.action='Bryder sten'}else if(p.job==='bygger'){work+=.75*efficiency;p.action='Bygger'}else if(p.job==='handler'){v.coins+=.12*efficiency;p.action='Handler'}else if(p.job==='forsker'){p.knowledge+=.0005;p.action='Undersøger'}else if(p.job==='vagt'){p.action='Holder vagt'}else{wood+=.15*efficiency;p.action='Fremstiller varer'}p.energy=clamp(p.energy-3+rnd(0,2),0,100);p.energy=clamp(p.energy+5,0,100);p.skill=clamp(p.skill+.00009,0,2);if(Math.random()<.20)movePerson(p,v)}v.food+=gather;v.wood+=wood;v.stone+=stone;v.iron+=iron;let works=S.buildings.filter(b=>b.village===v.id&&!b.done);if(works.length&&work){works[0].progress+=work/Math.max(8,works[0].type==='hut'?12:30);if(works[0].progress>=1)completeBuilding(works[0])}let farms=S.buildings.filter(b=>b.village===v.id&&b.done&&b.type==='farm').length;v.food+=farms*(S.tech.farming>=1?.75:.2);if(v.food<0){v.food=0;for(let p of people){p.health-=rnd(.04,.3);p.action='Mangler mad'}if(Math.random()<.025)log(`${v.name} oplever fødevaremangel.`,'danger')}else for(let p of people)p.health=clamp(p.health+.08,0,100);if(v.food>1000)v.food=1000;
const homes=S.buildings.filter(b=>b.village===v.id&&b.done&&b.type==='hut').length,farmsAll=S.buildings.filter(b=>b.village===v.id&&b.type==='farm').length;
if(S.buildings.filter(b=>b.village===v.id&&!b.done).length<2){if(homes*3+5<v.pop&&v.wood>=4)build(v,'hut');else if(farmsAll<Math.max(1,Math.floor(v.pop/7))&&v.wood>=2)build(v,'farm');else if(S.tech.woodworking>=1&&v.wood>=6&&v.stone>=2&&!S.buildings.some(b=>b.village===v.id&&b.type==='workshop'))build(v,'workshop');else if(S.tech.mining>=1&&v.wood>=5&&v.stone>=3&&!S.buildings.some(b=>b.village===v.id&&b.type==='mine'))build(v,'mine');else if(S.tech.trade>=1&&v.wood>=7&&v.stone>=4&&!S.buildings.some(b=>b.village===v.id&&b.type==='market'))build(v,'market');else if(v.conflicts>3&&v.wood>=8&&v.stone>=5&&!S.buildings.some(b=>b.village===v.id&&b.type==='guardhouse'))build(v,'guardhouse');else if(S.tech.governance>=1&&v.pop>25&&v.wood>=12&&v.stone>=8&&!S.buildings.some(b=>b.village===v.id&&b.type==='hall'))build(v,'hall');else if(S.tech.engineering>=2&&v.wood>=18&&v.stone>=12&&!S.buildings.some(b=>b.village===v.id&&b.type==='factory'))build(v,'factory');else if(S.tech.electricity>=1&&v.wood>=25&&v.stone>=20&&!S.buildings.some(b=>b.village===v.id&&b.type==='power'))build(v,'power')}
if(v.pop>10&&Math.random()<.0007){let candidates=people.filter(p=>age(p)>20);if(candidates.length){let leader=candidates.sort((a,b)=>(b.trust+b.ambition)-(a.trust+a.ambition))[0];if(v.leader!==leader.id){v.leader=leader.id;log(`${leader.name} får indflydelse i ${v.name}.`,'social')}}}if(v.pop>20&&v.territory<25&&Math.random()<.01)v.territory+=.1;techStep(v)}
function socialDaily(){let live=alive();for(let p of live){let a=age(p);if((a>65&&Math.random()<Math.min(.08,(a-65)*.0007))||a>105||p.health<=0){kill(p,p.health<=0?'sygdom eller sult':null);continue}if(a>=16&&p.job==='barn')p.job=pick(jobs.slice(0,4));if(a>=18&&a<46&&!p.partner&&Math.random()<.0012)findPartner(p);if(p.partner&&a>=18&&a<42&&S.day-p.lastBirth>YEAR*2&&Math.random()<.00035&&live.length<MAX_PEOPLE){let q=S.people.find(z=>z.id===p.partner);if(q&&q.dead===null&&age(q)<48&&q.village===p.village)birth(p,q)}if(a<16){const parents=[p.mother,p.father].map(id=>S.people.find(z=>z.id===id)).filter(z=>z&&z.dead===null);if(!parents.length){let caregiver=live.find(z=>z.village===p.village&&age(z)>18&&z.kindness>.55);if(caregiver){p.action='Bliver passet af '+caregiver.name}else p.health-=.18}}if(Math.random()<.00002&&a>16){let v=village(p.village);if(v){v.conflicts++;let victim=pick(live.filter(z=>z.village===p.village&&z.id!==p.id));if(victim){if(p.aggression>.9&&Math.random()<.05){kill(victim,'vold');log(`Et dødeligt overfald ryster ${v.name}.`,'danger')}else log(`Tyveri mistænkes i ${v.name}; beboerne diskuterer konsekvenser.`,'danger')}}}}
S.people=S.people.filter(p=>p.dead===null);}

function diplomacy(){if(S.villages.length<2)return;let a=pick(S.villages),b=pick(S.villages.filter(v=>v.id!==a.id));if(!b)return;let dist=Math.hypot(a.x-b.x,a.y-b.y);if(dist>85)return;let rel=a.relation[b.id]||0;if(Math.random()<.09){rel=clamp(rel+rnd(-4,5),-100,100);a.relation[b.id]=rel;b.relation[a.id]=rel}if(rel>25&&a.food>15&&b.food<10){let qty=Math.min(5,a.food-10);a.food-=qty;b.food+=qty;log(`${a.name} sender fødevarer til ${b.name}.`,'trade')}if(rel< -45&&Math.random()<.04){a.conflicts+=1;b.conflicts+=1;log(`Grænsestrid mellem ${a.name} og ${b.name}.`,'danger');if(rel< -75&&Math.random()<.3){let pa=S.people.filter(p=>p.village===a.id&&age(p)>16),pb=S.people.filter(p=>p.village===b.id&&age(p)>16);if(pa.length&&pb.length){let loser=pick(Math.random()<.5?pa:pb);loser.health-=rnd(5,35);log(`Væbnet sammenstød mellem ${a.name} og ${b.name}.`,'danger')}}}if(S.tech.governance>=1&&rel>65&&a.nation===null&&b.nation===null&&Math.random()<.08){let n={id:S.nextNation++,name:pick(['Union of','Kingdom of','Federation of'])+' '+a.name,formed:S.day};S.nations.push(n);a.nation=n.id;b.nation=n.id;log(`${a.name} og ${b.name} danner ${n.name}.`,'history')}}

let touches=new Map(),pinch=0;canvas.addEventListener('touchstart',e=>{for(let t of e.changedTouches)touches.set(t.identifier,{x:t.clientX,y:t.clientY});if(touches.size===2){let a=[...touches.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}},{passive:true});canvas.addEventListener('touchmove',e=>{for(let t of e.changedTouches)touches.set(t.identifier,{x:t.clientX,y:t.clientY});if(touches.size===2){let a=[...touches.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch>0)cam.z*=clamp(d/pinch,.8,1.2);pinch=d;resizeClamp();drag=null}},{passive:true});canvas.addEventListener('touchend',e=>{for(let t of e.changedTouches)touches.delete(t.identifier);if(touches.size<2)pinch=0},{passive:true});
function loop(t){let dt=Math.min(1000,t-(lastFrame||t));lastFrame=t;if(!paused){acc+=dt;while(acc>=DAY_MS&&acc<DAY_MS*3){daily();acc-=DAY_MS}if(acc>=DAY_MS*3)acc=0}if(t-renderAt>90){draw();renderAt=t}if(t-uiAt>1300){renderPane();uiAt=t}requestAnimationFrame(loop)}
if(!load())start();else{let v=S.villages[0];cam.x=v.x;cam.y=v.y;offline()}renderPane();requestAnimationFrame(loop);setInterval(()=>{if(dirty)save()},30000);document.addEventListener('visibilitychange',()=>{if(document.hidden){if(dirty)save()}else{if(!paused)offline();lastFrame=0;renderPane()}});window.addEventListener('pagehide',()=>{if(dirty)save()});
})();
</script></body></html>
